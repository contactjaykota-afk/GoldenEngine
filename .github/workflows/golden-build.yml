# Golden Engine — build the game for Windows x64 (and Linux) on GitHub-hosted runners.
# Upstream's build-game.yml targets The Funkin' Crew's self-hosted runners; this workflow uses
# standard runners so any fork can produce a Windows build.
name: Golden Engine build

on:
  workflow_dispatch:
  push:
    branches: [golden-engine]
    # Test-script and doc edits do not need a 40 minute rebuild; golden-test.yml covers test changes.
    paths-ignore:
      - 'golden/tests/**'
      - '!golden/tests/windows-runtime-test.ps1'   # the Windows runtime test runs after the build
      - 'golden/**.md'
      - '.github/workflows/golden-test.yml'

jobs:
  # Pure-Haxe unit tests (MIDI import etc.) — no game build needed, runs in about a minute.
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Unit tests
        run: golden/tests/unit/run-unit-tests.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev \
            libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libvlc-dev libvlccore-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols libegl-dev libxcursor-dev libxss-dev libdbus-1-dev \
            libudev-dev libdrm-dev libgbm-dev libdecor-0-dev libibus-1.0-dev libxtst-dev libxrender-dev libxxf86vm-dev libusb-1.0-0-dev libsamplerate0-dev libpipewire-0.3-dev libjack-jackd2-dev
      - name: Cache haxelibs
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: golden-haxelib-${{ runner.os }}-${{ hashFiles('hmm.json') }}
      - name: Install Haxe libraries
        run: golden/scripts/setup-deps.sh
      - name: Rebuild lime
        run: |
          haxelib run lime rebuild ${{ matrix.target }} -64 -release
      - name: Create empty .env (optional Newgrounds keys are not used)
        run: touch .env
      - name: Build Golden Engine
        run: haxelib run lime build ${{ matrix.target }} -release -v
      - name: Package release folder
        run: |
          BIN=export/release/${{ matrix.target }}/bin
          cp golden/release/README.txt golden/release/MODDING.md golden/release/EDITORS.md "$BIN/"
          cp golden/CHANGELOG.md "$BIN/GOLDEN-CHANGELOG.md"
          mkdir -p "$BIN/mods"
          echo "Put mods here (one folder per mod), or use Main menu > Mods." > "$BIN/mods/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-engine-${{ matrix.target }}-x64
          path: export/release/${{ matrix.target }}/bin

      # --- Golden Engine verification (runs after the artifact upload so a failing test never hides a good build) ---
      - name: Verify Windows package contents
        if: matrix.target == 'windows'
        run: |
          BIN=export/release/windows/bin
          test -f "$BIN/Funkin.exe" || { echo "::error::Funkin.exe missing"; exit 1; }
          test -d "$BIN/assets" || { echo "::error::assets folder missing"; exit 1; }
          echo "Funkin.exe: $(stat -c %s "$BIN/Funkin.exe") bytes"
          echo "DLLs: $(ls "$BIN"/*.dll 2>/dev/null | wc -l)"; ls "$BIN"/*.dll || true
          echo "Total size: $(du -sm "$BIN" | cut -f1) MB"
          grep -c "Golden Engine" "$BIN/Funkin.exe" >/dev/null && echo "window title string present in Funkin.exe" || echo "::warning::title string not found in exe"

  # Startup regression test on the Linux artifact produced above (see golden-test.yml).
  startup-test:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/golden-test.yml
    with:
      run_id: ${{ github.run_id }}

  # Launch the packaged Windows build on a Windows runner (see golden-windows-runtime.yml).
  windows-runtime-test:
    needs: build
    uses: ./.github/workflows/golden-windows-runtime.yml
    with:
      artifact: golden-engine-windows-x64
